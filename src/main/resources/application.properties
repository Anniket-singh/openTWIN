spring.application.name=open-twin-backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/opentwin}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Gemini Configuration
gemini.api-key=${GEMINI_API_KEY}
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
gemini.embedding.dimension=${GEMINI_EMBEDDING_DIMENSION:768}
gemini.generation.model=${GEMINI_GENERATION_MODEL:gemini-3.5-flash}

# Qdrant Configuration
qdrant.host=${QDRANT_HOST:localhost}
qdrant.grpc-port=${QDRANT_GRPC_PORT:6334}
qdrant.collection-name=${QDRANT_COLLECTION_NAME:open_twin_knowledge}
qdrant.vector-dimension=${QDRANT_VECTOR_DIMENSION:768}

# CORS
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}